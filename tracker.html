<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Трекер алгоритмов</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #f4f6fa; color: #2c3e50; line-height: 1.5;
    padding: 24px 16px;
  }
  .container { max-width: 1280px; margin: 0 auto; }

  header {
    background: #fff; border-radius: 14px; padding: 20px 24px;
    box-shadow: 0 2px 12px rgba(60, 80, 120, 0.06);
    margin-bottom: 18px;
  }
  .header-top {
    display: flex; justify-content: space-between;
    align-items: center; flex-wrap: wrap; gap: 14px;
    margin-bottom: 12px;
  }
  .header-bottom {
    display: flex; gap: 16px; align-items: center;
    flex-wrap: wrap; padding-top: 12px;
    border-top: 1px solid #eef2f7;
  }
  h1 { font-size: 22px; color: #34495e; font-weight: 600; }
  h1 span { color: #5b8def; }

  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .controls label { font-size: 13px; color: #6c7a89; }
  input[type="date"], input[type="text"].intervals-input {
    padding: 7px 10px; border: 1px solid #d6dde6; border-radius: 8px;
    font-size: 13px; color: #34495e; background: #f9fbfd;
    font-family: inherit;
  }
  input[type="text"].intervals-input { width: 130px; }
  button {
    padding: 8px 14px; border: none; border-radius: 8px;
    font-size: 13px; cursor: pointer; font-weight: 500;
    transition: all .15s; font-family: inherit;
  }
  .btn-primary { background: #5b8def; color: #fff; }
  .btn-primary:hover { background: #4a7ad9; }
  .btn-success { background: #5fa877; color: #fff; }
  .btn-success:hover { background: #4d9166; }
  .btn-danger { background: #fbeaea; color: #c0555a; }
  .btn-danger:hover { background: #f5d5d5; }
  .btn-icon {
    background: transparent; border: 1px solid #e2e8f0;
    color: #c0555a; padding: 4px 8px; border-radius: 6px;
    font-size: 14px; line-height: 1;
  }
  .btn-icon:hover { background: #fbeaea; }
  .btn-reset {
    background: transparent; border: 1px solid #e2e8f0;
    color: #b88139; padding: 4px 8px; border-radius: 6px;
    font-size: 13px; line-height: 1;
  }
  .btn-reset:hover { background: #fff2db; }

  .shift-toggle {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: #6c7a89; cursor: pointer;
    padding: 8px 12px; border-radius: 8px;
    background: #f9fbfd; border: 1px solid #eef2f7;
    user-select: none;
  }
  .shift-toggle:hover { background: #f2f6fb; }
  .shift-toggle input[type="checkbox"] {
    width: 16px; height: 16px; cursor: pointer;
    accent-color: #5b8def;
  }

  .stats {
    display: grid; grid-template-columns: 1fr 1fr 2fr;
    gap: 14px; margin-bottom: 18px;
  }
  .stat-card {
    background: #fff; border-radius: 12px; padding: 16px 20px;
    box-shadow: 0 2px 12px rgba(60, 80, 120, 0.06);
  }
  .stat-card .num { font-size: 26px; font-weight: 700; color: #5b8def; }
  .stat-card .num.green { color: #5fa877; }
  .stat-card .num.red { color: #c0555a; }
  .stat-card .label { font-size: 13px; color: #8892a0; margin-top: 2px; }
  .progress-wrap { display: flex; flex-direction: column; justify-content: center; }
  .progress-bar {
    height: 10px; background: #e8eef7; border-radius: 6px;
    overflow: hidden; margin-top: 8px;
  }
  .progress-bar > div {
    height: 100%; background: linear-gradient(90deg, #5b8def, #7fb685);
    width: 0%; transition: width .3s;
  }

  section {
    background: #fff; border-radius: 14px; padding: 20px 24px;
    box-shadow: 0 2px 12px rgba(60, 80, 120, 0.06);
    margin-bottom: 18px;
  }
  section h2 {
    font-size: 17px; color: #34495e; margin-bottom: 14px;
    font-weight: 600;
  }
  .review-empty { color: #8892a0; font-size: 14px; font-style: italic; }

  .task {
    display: grid;
    grid-template-columns: 28px 40px minmax(140px, 1.3fr) 62px minmax(110px, 1fr) 125px 165px 130px 56px;
    gap: 8px; padding: 10px 4px;
    border-bottom: 1px solid #eef2f7;
    align-items: center; font-size: 13px;
    transition: background .15s;
  }
  .task:last-child { border-bottom: none; }
  .task:hover { background: #f9fbfd; }
  .task.solved { background: #f7fbf9; }
  .task.solved:hover { background: #eef6f1; }
  .task.due-today { background: #fff8ec; }
  .task.due-today:hover { background: #fdf1dd; }
  .task.overdue { background: #fdf0f0; }
  .task.overdue:hover { background: #fbe4e4; }

  .task input[type="checkbox"] {
    width: 17px; height: 17px; cursor: pointer;
    accent-color: #5fa877; justify-self: center;
  }
  .task .num { color: #8892a0; font-size: 12px; }
  .task .name { color: #2c3e50; font-weight: 500; }
  .task .badge {
    display: inline-block; padding: 2px 8px; border-radius: 6px;
    font-size: 11px; font-weight: 500; text-align: center;
  }
  .badge.Easy { background: #e4f5ea; color: #4a8c5e; }
  .badge.Medium { background: #fff2db; color: #b88139; }
  .badge.Hard { background: #fbe6e6; color: #b85454; }
  .task .pattern { color: #6c7a89; font-size: 12px; }

  .task .solved-input {
    padding: 5px 6px; border: 1px solid #d6dde6; border-radius: 6px;
    font-size: 11px; font-family: inherit; color: #34495e;
    background: #fff; width: 100%;
  }
  .task .solved-input:disabled { background: #f4f6fa; color: #8892a0; }

  .review-controls { display: flex; gap: 4px; align-items: center; }
  .review-controls .review-input {
    padding: 5px 6px; border: 1px solid #d6dde6; border-radius: 6px;
    font-size: 11px; font-family: inherit; color: #34495e;
    background: #fff; width: 105px;
  }
  .review-controls .review-input:disabled { background: #f4f6fa; color: #8892a0; }
  .review-controls .btn-mark {
    background: #5fa877; color: #fff; border: none;
    padding: 5px 9px; border-radius: 6px; cursor: pointer;
    font-size: 13px; line-height: 1; font-weight: 700;
  }
  .review-controls .btn-mark:hover { background: #4d9166; }
  .review-controls .btn-mark:disabled {
    background: #d6dde6; color: #8892a0; cursor: not-allowed;
  }

  .status { font-size: 11px; line-height: 1.5; }
  .status .next { color: #5b8def; font-weight: 600; }
  .status .next.overdue { color: #c0555a; }
  .status .next.due-today { color: #c9843a; }
  .status .stage { color: #8892a0; }
  .status .released { color: #5fa877; font-weight: 600; }
  .status .muted { color: #b8c2cc; }

  .actions { display: flex; gap: 4px; justify-content: flex-end; }

  .stage-title {
    font-size: 12px; text-transform: uppercase;
    letter-spacing: 0.5px; color: #8892a0;
    margin: 18px 0 6px; font-weight: 600;
  }
  .stage-title:first-child { margin-top: 0; }

  .add-form {
    display: none; grid-template-columns: 2fr 90px 2fr 2fr auto auto;
    gap: 10px; padding: 14px 4px; margin-bottom: 10px;
    background: #f9fbfd; border-radius: 10px; align-items: center;
  }
  .add-form.open { display: grid; }
  .add-form input, .add-form select {
    padding: 7px 10px; border: 1px solid #d6dde6; border-radius: 8px;
    font-size: 13px; font-family: inherit; color: #34495e;
    background: #fff;
  }

  .review-item {
    display: grid;
    grid-template-columns: minmax(140px, 1.3fr) 62px minmax(110px, 1fr) 130px 165px;
    gap: 10px; padding: 10px 4px;
    border-bottom: 1px solid #eef2f7;
    align-items: center; font-size: 13px;
  }
  .review-item:last-child { border-bottom: none; }
  .review-item.overdue { background: #fdf0f0; border-radius: 8px; }
  .review-due { font-size: 11px; color: #c9843a; font-weight: 600; }
  .review-due.overdue { color: #c0555a; }

  @media (max-width: 1000px) {
    .task {
      grid-template-columns: 28px 36px 1fr 56px;
      grid-template-areas:
        "chk num name actions"
        ".   .   level level"
        ".   .   pattern pattern"
        ".   .   solved solved"
        ".   .   review review"
        ".   .   status status";
      row-gap: 6px;
    }
    .task input[type="checkbox"] { grid-area: chk; }
    .task .num { grid-area: num; }
    .task .name { grid-area: name; }
    .task .badge { grid-area: level; justify-self: start; }
    .task .pattern { grid-area: pattern; }
    .task .solved-input { grid-area: solved; max-width: 200px; }
    .task .review-controls { grid-area: review; }
    .task .status { grid-area: status; }
    .task .actions { grid-area: actions; }

    .stats { grid-template-columns: 1fr 1fr; }
    .stat-card.wide { grid-column: span 2; }
    .add-form { grid-template-columns: 1fr 1fr; }
    .review-item { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="container">

  <header>

    </div>
  </div>

  <section>
    <h2>🔔 На сегодня и просроченные</h2>

  </section>

  <section>
    <h2>📚 Все задачи</h2>
    <button class="btn-success" id="showAddForm" style="margin-bottom:12px;">+ Добавить задачу</button>
    <div class="add-form" id="addForm">
      <input type="text" id="newName" placeholder="Название задачи">
      <select id="newLevel">
        <option>Easy</option>
        <option selected>Medium</option>
        <option>Hard</option>
      </select>
      <input type="text" id="newPattern" placeholder="Паттерн">
      <select id="newStage"></select>
      <button class="btn-primary" id="confirmAdd">Добавить</button>
      <button class="btn-danger" id="cancelAdd">Отмена</button>
    </div>
    <div id="taskList"></div>
  </section>

</div>

function todayStr() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function addDays(dateStr, days) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  dt.setDate(dt.getDate() + days);
  const yy = dt.getFullYear();
  const mm = String(dt.getMonth() + 1).padStart(2, '0');
  const dd = String(dt.getDate()).padStart(2, '0');
  return `${yy}-${mm}-${dd}`;
}

function fmt(dateStr) {
  if (!dateStr) return '';
  const [, m, d] = dateStr.split('-');
  return `${d}.${m}`;
}

function dayOfWeek(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return new Date(y, m - 1, d).getDay();
}

function shiftToMonday(dateStr) {
  const day = dayOfWeek(dateStr);
  if (day === 0) return addDays(dateStr, 1);
  if (day === 6) return addDays(dateStr, 2);
  return dateStr;
}

// =====================================================
// МОДЕЛЬ ПОВТОРЕНИЙ
// =====================================================
// Следующая дата = (lastReviewDate || solvedDate) + intervals[reviewStage]
// Сдвиг выходных — только для отображения. Фактическая дата повторения
// берётся как есть и становится новой базой.

function isReleased(task) {
  return task.reviewStage >= state.intervals.length;
}

function getNextReviewRaw(task) {
  if (!task.solvedDate) return null;
  if (isReleased(task)) return null;
  const base = task.lastReviewDate || task.solvedDate;
  const interval = state.intervals[task.reviewStage];
  if (interval === undefined) return null;
  return addDays(base, interval);
}

function getNextReviewDisplay(task) {
  const raw = getNextReviewRaw(task);
  if (!raw) return null;
  return state.shiftWeekends ? shiftToMonday(raw) : raw;
}

function getDueStatus(task) {
  if (!task.solvedDate) return 'none';
  if (isReleased(task)) return 'released';
  const display = getNextReviewDisplay(task);
  if (!display) return 'none';
  const today = todayStr();
  if (display < today) return 'overdue';
  if (display === today) return 'today';
  return 'future';
}

// =====================================================
// МИГРАЦИЯ И ХРАНИЛИЩЕ
// =====================================================
function normalizeTask(t) {
  const solvedDate = t.solvedDate || null;
  let history = Array.isArray(t.history) ? t.history : null;
  if (!history) {
    history = solvedDate ? [{type:'solve', date: solvedDate, stage: 0}] : [];
  }
  return {
    name: t.name || 'Unnamed',
    level: t.level || 'Medium',
    pattern: t.pattern || '',
    stage: t.stage || 1,
    solvedDate,
    lastReviewDate: t.lastReviewDate || null,
    reviewStage: Number.isInteger(t.reviewStage) ? t.reviewStage : 0,
    released: !!t.released,
    history
  };
}

function loadState() {
  try {
    let raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      for (const oldKey of OLD_STORAGE_KEYS) {
        const old = localStorage.getItem(oldKey);
        if (old) { raw = old; break; }
      }
    }
    if (!raw) throw new Error('empty');
    const parsed = JSON.parse(raw);
    if (!parsed.tasks || !Array.isArray(parsed.tasks)) throw new Error('bad');
    let intervals = Array.isArray(parsed.intervals) ? parsed.intervals : null;
    if (!intervals || intervals.length === 0) {
      intervals = [...DEFAULT_INTERVALS];
    } else {
      intervals = intervals
        .filter(x => Number.isInteger(x) && x > 0)
        .filter((v, i, a) => a.indexOf(v) === i)
        .sort((a, b) => a - b);
      if (intervals.length === 0) intervals = [...DEFAULT_INTERVALS];
    }
    return {
      startDate: parsed.startDate || todayStr(),
      intervals: intervals,
      shiftWeekends: !!parsed.shiftWeekends,
      tasks: parsed.tasks.map(normalizeTask)
    };
  } catch (e) {
    return {
      startDate: todayStr(),
      intervals: [...DEFAULT_INTERVALS],
      shiftWeekends: false,
      tasks: DEFAULT_TASKS.map(t => normalizeTask({...t, solvedDate: null}))
    };
  }
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

let state = loadState();

// =====================================================
// DOM
// =====================================================
const startInput = document.getElementById('startDate');
const intervalsInput = document.getElementById('intervalsInput');
const shiftWeekendsChk = document.getElementById('shiftWeekends');
const taskListEl = document.getElementById('taskList');
const reviewListEl = document.getElementById('reviewList');
const solvedCountEl = document.getElementById('solvedCount');
const totalCountEl = document.getElementById('totalCount');
const dueCountEl = document.getElementById('dueCount');
const overdueCountEl = document.getElementById('overdueCount');
const progressFillEl = document.getElementById('progressFill');
const progressLabelEl = document.getElementById('progressLabel');

startInput.value = state.startDate;
intervalsInput.value = state.intervals.join(', ');
shiftWeekendsChk.checked = state.shiftWeekends;

// =====================================================
// ДЕЙСТВИЯ НАД ЗАДАЧЕЙ
// =====================================================
function markSolved(task, date) {
  task.solvedDate = date;
  task.lastReviewDate = null;
  task.reviewStage = 0;
  task.released = false;
  task.history = [{ type: 'solve', date, stage: 0 }];
}

function clearSolved(task) {
  task.solvedDate = null;
  task.lastReviewDate = null;
  task.reviewStage = 0;
  task.released = false;
  task.history = [];
}

function markReviewed(task, date) {
  if (!task.solvedDate) return;
  if (isReleased(task)) return;
  task.lastReviewDate = date;
  task.reviewStage += 1;
  if (task.reviewStage >= state.intervals.length) task.released = true;
  task.history.push({ type: 'review', date, stage: task.reviewStage });
}

function resetProgress(task) {
  if (!task.solvedDate) return;
  task.lastReviewDate = null;
  task.reviewStage = 0;
  task.released = false;
  task.history = [{ type: 'solve', date: task.solvedDate, stage: 0 }];
}

// =====================================================
// РЕНДЕР
// =====================================================
function render() {
  taskListEl.innerHTML = '';
  let globalNum = 0;

  STAGES.forEach((stageTitle, idx) => {
    const stageNumber = idx + 1;
    const stageTasks = state.tasks.filter(t => t.stage === stageNumber);
    if (stageTasks.length === 0) return;

    const header = document.createElement('div');
    header.className = 'stage-title';
    header.textContent = stageTitle;
    taskListEl.appendChild(header);

    stageTasks.forEach(task => {
      globalNum++;
      taskListEl.appendChild(buildTaskRow(task, globalNum));
    });
  });

  renderReviews();
  renderStats();
}

function buildTaskRow(task, displayNumber) {
  const solved = !!task.solvedDate;
  const status = getDueStatus(task);

  const row = document.createElement('div');
  row.className = 'task' + (solved ? ' solved' : '');
  if (status === 'today') row.classList.add('due-today');
  if (status === 'overdue') row.classList.add('overdue');

  // Checkbox
  const chk = document.createElement('input');
  chk.type = 'checkbox';
  chk.checked = solved;
  chk.addEventListener('change', () => {
    if (chk.checked) markSolved(task, todayStr());
    else clearSolved(task);
    saveState();
    render();
  });
  row.appendChild(chk);

  // Number
  const numEl = document.createElement('div');
  numEl.className = 'num';
  numEl.textContent = '#' + displayNumber;
  row.appendChild(numEl);

  // Name
  const nameEl = document.createElement('div');
  nameEl.className = 'name';
  nameEl.textContent = task.name;
  row.appendChild(nameEl);

  // Level
  const badge = document.createElement('span');
  badge.className = 'badge ' + task.level;
  badge.textContent = task.level;
  row.appendChild(badge);

  // Pattern
  const patEl = document.createElement('div');
  patEl.className = 'pattern';
  patEl.textContent = task.pattern;
  row.appendChild(patEl);

  // Solved date
  const solvedInput = document.createElement('input');
  solvedInput.type = 'date';
  solvedInput.className = 'solved-input';
  solvedInput.value = task.solvedDate || '';
  solvedInput.disabled = !solved;
  solvedInput.title = solved ? 'Дата первого решения' : 'Сначала отметьте задачу решённой';
  solvedInput.addEventListener('change', () => {
    if (solvedInput.value) {
      // если меняем дату решения — не сбрасываем историю, но обновляем базу,
      // если повторений ещё не было
      task.solvedDate = solvedInput.value;
      if (!task.lastReviewDate) {
        task.history = [{ type: 'solve', date: task.solvedDate, stage: 0 }];
      }
    }
    saveState();
    render();
  });
  row.appendChild(solvedInput);

  // Review controls
  const rc = document.createElement('div');
  rc.className = 'review-controls';

  const reviewInput = document.createElement('input');
  reviewInput.type = 'date';
  reviewInput.className = 'review-input';
  reviewInput.title = 'Дата повторения (пусто = сегодня)';
  reviewInput.disabled = !solved || isReleased(task);
  rc.appendChild(reviewInput);

  const markBtn = document.createElement('button');
  markBtn.className = 'btn-mark';
  markBtn.textContent = '✓';
  markBtn.title = isReleased(task) ? 'Все повторения пройдены' : 'Отметить повторение';
  markBtn.disabled = !solved || isReleased(task);
  markBtn.addEventListener('click', () => {
    const date = reviewInput.value || todayStr();
    markReviewed(task, date);
    saveState();
    render();
  });
  rc.appendChild(markBtn);

  row.appendChild(rc);

  // Status
  const statusEl = document.createElement('div');
  statusEl.className = 'status';
  if (!solved) {
    statusEl.innerHTML = '<span class="muted">—</span>';
  } else if (isReleased(task)) {
    statusEl.innerHTML = '<span class="released">✅ выпущена</span>';
  } else {
    const display = getNextReviewDisplay(task);
    const stageNum = task.reviewStage + 1;
    const total = state.intervals.length;
    let cls = '';
    if (status === 'overdue') cls = 'overdue';
    else if (status === 'today') cls = 'due-today';
    statusEl.innerHTML = `<div class="next ${cls}">→ ${fmt(display)}</div><div class="stage">этап ${stageNum}/${total}</div>`;
  }
  row.appendChild(statusEl);

  // Actions
  const actions = document.createElement('div');
  actions.className = 'actions';

  const resetBtn = document.createElement('button');
  resetBtn.className = 'btn-reset';
  resetBtn.textContent = '↺';
  resetBtn.title = 'Сбросить прогресс повторений (начать с этапа 1)';
  resetBtn.disabled = !solved || (task.reviewStage === 0 && !task.lastReviewDate);
  resetBtn.addEventListener('click', () => {
    if (!confirm('Сбросить прогресс повторений для «' + task.name + '»?\nЗадача останется решённой, но интервалы начнутся заново.')) return;
    resetProgress(task);
    saveState();
    render();
  });
  actions.appendChild(resetBtn);

  const delBtn = document.createElement('button');
  delBtn.className = 'btn-icon';
  delBtn.textContent = '×';
  delBtn.title = 'Удалить задачу';
  delBtn.addEventListener('click', () => {
    if (!confirm('Удалить задачу «' + task.name + '»?')) return;
    const i = state.tasks.indexOf(task);
    if (i !== -1) state.tasks.splice(i, 1);
    saveState();
    render();
  });
  actions.appendChild(delBtn);

  row.appendChild(actions);

  return row;
}

function renderReviews() {
  const today = todayStr();
  const items = [];

  state.tasks.forEach(t => {
    const st = getDueStatus(t);
    if (st === 'today' || st === 'overdue') {
      const raw = getNextReviewRaw(t);
      items.push({ task: t, status: st, display: getNextReviewDisplay(t), raw });
    }
  });

  // Сортируем: сначала просроченные (старые), потом сегодняшние
  items.sort((a, b) => a.raw.localeCompare(b.raw));

  reviewListEl.innerHTML = '';
  if (items.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'review-empty';
    empty.textContent = 'На сегодня повторений нет. 🎉';
    reviewListEl.appendChild(empty);
    return;
  }

  items.forEach(item => {
    const t = item.task;
    const row = document.createElement('div');
    row.className = 'review-item' + (item.status === 'overdue' ? ' overdue' : '');

    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = t.name;
    row.appendChild(name);

    const badge = document.createElement('span');
    badge.className = 'badge ' + t.level;
    badge.textContent = t.level;
    row.appendChild(badge);

    const pat = document.createElement('div');
    pat.className = 'pattern';
    pat.textContent = t.pattern;
    row.appendChild(pat);

    const due = document.createElement('div');
    due.className = 'review-due' + (item.status === 'overdue' ? ' overdue' : '');
    due.textContent = item.status === 'overdue'
      ? `⚠ просрочено с ${fmt(item.display)}`
      : `сегодня (этап ${t.reviewStage + 1}/${state.intervals.length})`;
    row.appendChild(due);

    const rc = document.createElement('div');
    rc.className = 'review-controls';

    const input = document.createElement('input');
    input.type = 'date';
    input.className = 'review-input';
    input.title = 'Дата повторения (пусто = сегодня)';
    rc.appendChild(input);

    const btn = document.createElement('button');
    btn.className = 'btn-mark';
    btn.textContent = '✓';
    btn.title = 'Отметить повторение';
    btn.addEventListener('click', () => {
      const date = input.value || todayStr();
      markReviewed(t, date);
      saveState();
      render();
    });
    rc.appendChild(btn);

    row.appendChild(rc);

    reviewListEl.appendChild(row);
  });
}

function renderStats() {
  const total = state.tasks.length;
  const solved = state.tasks.filter(t => t.solvedDate).length;
  solvedCountEl.textContent = solved;
  totalCountEl.textContent = total;

  const percent = total > 0 ? Math.round(solved / total * 100) : 0;
  progressFillEl.style.width = percent + '%';
  progressLabelEl.textContent = `Прогресс: ${percent}%`;

  let todayCount = 0;
  let overdueCount = 0;
  state.tasks.forEach(t => {
    const st = getDueStatus(t);
    if (st === 'today') todayCount++;
    else if (st === 'overdue') overdueCount++;
  });
  dueCountEl.textContent = todayCount;
  overdueCountEl.textContent = overdueCount;
}

// =====================================================
// ИНТЕРВАЛЫ
// =====================================================
document.getElementById('applyIntervals').addEventListener('click', () => {
  const raw = intervalsInput.value;
  const parts = raw.split(/[,\s]+/).filter(s => s.length > 0);
  const numbers = parts.map(s => parseInt(s, 10));

  if (parts.length === 0) {
    alert('Введите хотя бы один интервал. Например: 3, 7, 21');
    return;
  }
  if (numbers.some(n => !Number.isInteger(n) || n <= 0)) {
    alert('Все интервалы должны быть положительными целыми числами.');
    return;
  }

  const unique = [...new Set(numbers)].sort((a, b) => a - b);
  state.intervals = unique;
  saveState();
  intervalsInput.value = unique.join(', ');
  render();
  alert('Интервалы обновлены: ' + unique.join(', '));
});

// =====================================================
// СДВИГ ВЫХОДНЫХ
// =====================================================
shiftWeekendsChk.addEventListener('change', () => {
  state.shiftWeekends = shiftWeekendsChk.checked;
  saveState();
  render();
});

// =====================================================
// ФОРМА ДОБАВЛЕНИЯ
// =====================================================
const addForm = document.getElementById('addForm');
const newStageSelect = document.getElementById('newStage');

STAGES.forEach((title, idx) => {
  const opt = document.createElement('option');
  opt.value = idx + 1;
  opt.textContent = title;
  newStageSelect.appendChild(opt);
});

document.getElementById('showAddForm').addEventListener('click', () => {
  addForm.classList.toggle('open');
});

document.getElementById('cancelAdd').addEventListener('click', () => {
  addForm.classList.remove('open');
  document.getElementById('newName').value = '';
  document.getElementById('newPattern').value = '';
});

document.getElementById('confirmAdd').addEventListener('click', () => {
  const name = document.getElementById('newName').value.trim();
  const level = document.getElementById('newLevel').value;
  const pattern = document.getElementById('newPattern').value.trim();
  const stage = parseInt(newStageSelect.value, 10);

  if (!name) {
    alert('Введите название задачи');
    return;
  }

  state.tasks.push(normalizeTask({
    name, level, pattern, stage, solvedDate: null
  }));
  saveState();

  document.getElementById('newName').value = '';
  document.getElementById('newPattern').value = '';
  addForm.classList.remove('open');
  render();
});

// =====================================================
// УПРАВЛЕНИЕ
// =====================================================
document.getElementById('updateStart').addEventListener('click', () => {
  const v = startInput.value;
  if (!v) return;
  state.startDate = v;
  saveState();
  alert('Дата старта обновлена: ' + v);
});

document.getElementById('resetBtn').addEventListener('click', () => {
  if (!confirm('Сбросить ВСЁ: чекбоксы, даты решения, историю повторений, добавленные задачи, интервалы, дату старта, сдвиг выходных?')) return;
  localStorage.removeItem(STORAGE_KEY);
  OLD_STORAGE_KEYS.forEach(k => localStorage.removeItem(k));
  state = {
    startDate: todayStr(),
    intervals: [...DEFAULT_INTERVALS],
    shiftWeekends: false,
    tasks: DEFAULT_TASKS.map(t => normalizeTask({...t, solvedDate: null}))
  };
  startInput.value = state.startDate;
  intervalsInput.value = state.intervals.join(', ');
  shiftWeekendsChk.checked = false;
  render();
});

// =====================================================
// СТАРТ
// =====================================================
render();
</script>
</body>
</html>
